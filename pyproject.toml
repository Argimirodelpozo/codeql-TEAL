[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tealql"
version = "0.1.0"
description = "Pure-Python static analysis for TEAL (Algorand Virtual Machine)"
readme = "README.md"
# 3.12 is the tested floor, and the optional lift extra (puyapy) requires it
# anyway — a lower declared floor would promise untested interpreters.
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Argimirodelpozo" }]
keywords = ["teal", "algorand", "static-analysis", "avm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "PyYAML>=6",
    "networkx>=3",
    # The parse floor: py-tree-sitter binding + the TEAL grammar. The grammar
    # is a direct git dependency (pinned commit) — that installs fine from a
    # clone or a git URL, but PyPI rejects distributions with direct-URL
    # dependencies, so publishing tealql to PyPI requires first publishing
    # tree-sitter-teal there and swapping this line for a version constraint.
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-teal @ git+https://github.com/Argimirodelpozo/tree-sitter-teal.git@4468a5acb379de12efd77ee4ddcb755fa054b24f",
]

[project.optional-dependencies]
# Decompilation to real Puya IR (``tealql`` lift / ``python -m tealql.tealtools.lift``).
# The analysis + detection layers — including the interprocedural ir-* detectors,
# whose taint runs on the puya-free pre-IR — do NOT need this; only lowering to
# genuine ``puya.ir.models`` does. Pinned to the tested minor: the lift touches
# puya compiler internals with no stability guarantee across releases.
lift = ["puyapy>=5.7,<5.8"]
# Test / development toolchain (already assumed by the suite: xdist for
# parallelism, timeout to fail hangs, cov for coverage). Install with
# ``pip install -e '.[dev]'``.
dev = [
    "pytest>=8",
    "pytest-xdist",
    "pytest-timeout",
    "pytest-cov",
    "coverage",
    # property-based testing — soundness membership tests for the abstract
    # domains (concrete result must lie in the propagated range/length).
    "hypothesis>=6",
]

[project.urls]
Repository = "https://github.com/Argimirodelpozo/codeql-TEAL"

[project.scripts]
tealql = "tealql.cli.main:main"

# Required for the tree-sitter-teal git dependency above (hatchling refuses
# direct references by default, precisely because PyPI would reject them —
# acceptable here: install is from a clone / git URL, not PyPI, for now).
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# ONE top-level package, standard src layout: ``tealql.tealtools`` (analysis
# substrate), ``tealql.security`` (detection layer, importlib-loaded detector
# bodies), ``tealql.cli`` (the console entry point). Everything runs in pure
# Python from TEAL source — no external backend. (The previous three-package
# layout produced a broken wheel: hatch shipped ``analysis/`` instead of
# mapping ``src/analysis/tealtools`` to top-level ``tealtools`` — only the
# editable-install path finder masked it.)
packages = ["src/tealql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-timeout: a generous per-test ceiling so a genuine hang fails loudly
# instead of blocking CI; every real test is far under this (big-DB corpus
# tests included).
timeout = 300
# Registered markers (so `--strict-markers` stays clean and the gated layers
# are documented/selectable). Most gates are env-driven today (LIFT_SEMANTICS_*,
# importorskip("puya")); these are for tests that opt in explicitly.
markers = [
    "slow: long-running (big real-DB) test",
    "puya: requires the puya/puyapy package (the lift backend)",
]
filterwarnings = ["ignore::DeprecationWarning"]

# Coverage is opt-in (CI runs `pytest --cov`); it is NOT in addopts so a plain
# `pytest` works without pytest-cov installed. See the [tool.coverage.*] config.
[tool.coverage.run]
branch = true
source = ["src/tealql"]
omit = [
    "*/viz/*",          # Graphviz DOT/SVG debug rendering — not the analysis product
    "*/__main__.py",    # module CLI entry points
    "*/_utils/dot.py",  # Graphviz helpers
]

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
# Conservative REGRESSION floor, not a target. The hermetic suite covers ~79%
# (higher with LIFT_SEMANTICS_CORPUS/BACKEND). The real-contract fixtures
# under tests/contracts/ are tracked now, so a fresh clone runs the full
# hermetic suite; the floor stays below the measured value to catch only a
# real regression. Ratchet upward as CI pins the number.
fail_under = 68

[tool.ruff]
# Formatting is NOT gated: this codebase has deliberate alignment and comment
# layout that a formatter would flatten, and reflowing 18k lines would bury
# every future diff. Ruff is here as a BUG detector, not a style enforcer.
target-version = "py312"
line-length = 100

# Vendored generated source: the algopy contracts the example TEAL was compiled
# FROM, carrying "Code automatically generated - DO NOT EDIT". They are evidence
# of provenance, not code we maintain, so editing them to satisfy a linter would
# be the wrong fix.
extend-exclude = ["examples/**/BasicVerifier.py"]

[tool.ruff.lint]
# F  = pyflakes: undefined names, unused imports/locals -- real defects, and
#      the class that had accumulated 12 uncaught instances before this gate.
# E9 = syntax / IO errors.
# Deliberately NOT enabled: UP (594 hits), E (618, nearly all line length),
# ARG (76), B (36), SIM (44). Each is defensible, none is a bug today, and a
# gate nobody can get to zero is a gate that gets disabled. Add them one at a
# time, each with its own cleanup commit.
select = ["F", "E9"]

# No per-file-ignore for __init__.py F401, which is the usual reflex: every
# package __init__ here is already clean without one, and keeping the rule on
# is what caught `dataflow` re-exporting `detect_out_of_state_flows` while
# leaving its sharper sibling and violation type out of __all__. An unused
# re-export must join __all__ or go.
