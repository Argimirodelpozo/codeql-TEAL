[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tealql"
version = "0.1.0"
description = "Pure-Python static analysis for TEAL (Algorand Virtual Machine)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Argimirodelpozo" }]
keywords = ["teal", "algorand", "static-analysis", "avm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "PyYAML>=6",
    "networkx>=3",
]

[project.urls]
Repository = "https://github.com/Argimirodelpozo/codeql-TEAL"

[project.scripts]
tealql = "cli.main:main"

[tool.hatch.build.targets.wheel]
# Two packages: the ``tealtools`` analysis library (at
# ``src/analysis/tealtools/``) and the ``cli`` command-line front-end
# (at the top-level ``cli/`` directory). Everything runs in pure Python
# from TEAL source — no external backend.
packages = ["src/analysis/tealtools", "cli"]
