[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tealql"
version = "0.1.0"
description = "Pure-Python static analysis for TEAL (Algorand Virtual Machine)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Argimirodelpozo" }]
keywords = ["teal", "algorand", "static-analysis", "avm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "PyYAML>=6",
    "networkx>=3",
]

[project.optional-dependencies]
# Decompilation to real Puya IR (``tealql`` lift / ``python -m tealtools.lift``).
# The analysis + detection layers — including the interprocedural ir-* detectors,
# whose taint runs on the puya-free pre-IR — do NOT need this; only lowering to
# genuine ``puya.ir.models`` does. Pinned to the tested minor: the lift touches
# puya compiler internals with no stability guarantee across releases.
lift = ["puyapy>=5.7,<5.8"]
# Test / development toolchain (already assumed by the suite: xdist for
# parallelism, timeout to fail hangs, cov for coverage). Install with
# ``pip install -e '.[dev]'``.
dev = [
    "pytest>=8",
    "pytest-xdist",
    "pytest-timeout",
    "pytest-cov",
    "coverage",
]

[project.urls]
Repository = "https://github.com/Argimirodelpozo/codeql-TEAL"

[project.scripts]
tealql = "cli.main:main"

[tool.hatch.build.targets.wheel]
# Three packages: the ``tealtools`` analysis library (``src/analysis/tealtools/``),
# the ``security`` detection layer (framework + importlib-loaded detector bodies,
# ``src/security/``), and the ``cli`` command-line front-end (top-level ``cli/``).
# Everything runs in pure Python from TEAL source — no external backend.
packages = ["src/analysis/tealtools", "src/security", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-timeout: a generous per-test ceiling so a genuine hang fails loudly
# instead of blocking CI; every real test is far under this (big-DB corpus
# tests included).
timeout = 300
# Registered markers (so `--strict-markers` stays clean and the gated layers
# are documented/selectable). Most gates are env-driven today (LIFT_SEMANTICS_*,
# importorskip("puya")); these are for tests that opt in explicitly.
markers = [
    "slow: long-running (big real-DB) test",
    "puya: requires the puya/puyapy package (the lift backend)",
]
filterwarnings = ["ignore::DeprecationWarning"]

# Coverage is opt-in (CI runs `pytest --cov`); it is NOT in addopts so a plain
# `pytest` works without pytest-cov installed. See the [tool.coverage.*] config.
[tool.coverage.run]
branch = true
source = ["src/analysis/tealtools", "src/security", "cli"]
omit = [
    "*/viz/*",          # Graphviz DOT/SVG debug rendering — not the analysis product
    "*/__main__.py",    # module CLI entry points
    "*/_utils/dot.py",  # Graphviz helpers
]

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
# Conservative REGRESSION floor, not a target. The hermetic suite covers ~79%
# (higher with LIFT_SEMANTICS_CORPUS/BACKEND); a fresh clone WITHOUT the
# gitignored tests/dbs/ fixtures skips ~45 substrate tests and drops lower, so
# the floor is set to survive that and catch only a real regression. Ratchet it
# up once the real-DB fixtures ship in CI.
fail_under = 68
