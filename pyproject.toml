[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tealql"
version = "0.1.0"
description = "TEAL static analysis powered by CodeQL"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Argimirodelpozo" }]
keywords = ["teal", "algorand", "codeql", "static-analysis", "avm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "PyYAML>=6",
    "networkx>=3",
]

[project.urls]
Repository = "https://github.com/Argimirodelpozo/codeql-TEAL"

[project.scripts]
tealql = "tealtools.cli:main"

[tool.hatch.build.targets.wheel]
# The Python package; the CodeQL extractor + QL backend live outside
# the Python tree and are expected to be available on the user's
# machine (codeql CLI on PATH, repo's .codeql-extractors/ checked
# out alongside the install for development use).
packages = ["tealtools"]

[tool.hatch.build.targets.wheel.force-include]
# Bundle the .ql packs that tealtools.graphs depends on at runtime;
# without them the SSAProgram loader can't refresh its cached
# CodeQL annotations.
"tealtools/queries" = "tealtools/queries"
