# CI: a seconds-long ruff gate, the full hermetic suite (incl. the 248-case
# Puya lift corpus and the real-contract fixtures under tests/contracts/), and
# a non-editable wheel-install smoke job. The wheel job exists because an editable install masks broken
# wheel layouts (learned the hard way: the pre-src-layout wheel shipped an
# unimportable package for months while an editable install worked fine).
#
# Managed with uv: `uv sync --locked` installs the EXACT locked tree (uv.lock),
# so CI matches every contributor's env — important because we pin puya
# compiler internals (<5.8) and a git-pinned tree-sitter-teal commit. hatchling
# stays the build backend; uv is the resolver / installer / runner.
#
# Not run here: the behavioural lift gate and the assembler differential —
# both need a live algod localnet, so they stay developer-side. Everything
# else runs, including the Tier-3 backend harness (LIFT_SEMANTICS_BACKEND —
# once believed slow, measured 2026-08-05 at +5 tests / ~5s).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    # Separate from `test` and deliberately tiny: no env sync, so it reports in
    # seconds instead of behind an 8-minute suite. Scope is bug rules only
    # (F, E9) — see the reasoning in [tool.ruff.lint]. The dependency-direction
    # rule is NOT here; it is a pytest test (tests/test_layering.py) so it runs
    # locally too, where an architecture rule is actually useful.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Ruff — unused imports, undefined names, syntax
        run: uvx ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked env (core + lift + dev)
        # --locked fails if uv.lock is out of date w.r.t. pyproject.toml — a
        # dep bump without re-locking is caught here, not silently floated.
        run: uv sync --locked --extra lift --extra dev
      - name: Test — full suite + lift corpus + coverage floor
        env:
          LIFT_SEMANTICS_CORPUS: "1"
          LIFT_SEMANTICS_BACKEND: "1"
        run: uv run pytest tests/ -q -n auto --cov

  wheel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build the wheel + install it non-editably into a fresh venv
        run: |
          uv build --wheel
          uv venv /tmp/wheelenv
          uv pip install --python /tmp/wheelenv dist/*.whl
      - name: Import + CLI run from site-packages only
        run: |
          cd /tmp
          /tmp/wheelenv/bin/python -c "import tealql.tealtools, tealql.security, tealql.cli"
          # `tealql all` exits 1 on findings (this fixture has some) — only
          # exit 2 (crash / usage error) fails the job.
          /tmp/wheelenv/bin/tealql all "$GITHUB_WORKSPACE/tests/contracts/repro/approval.teal" && rc=0 || rc=$?
          test "$rc" -le 1
