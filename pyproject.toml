[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tealql"
version = "0.1.0"
description = "TEAL static analysis powered by CodeQL"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Argimirodelpozo" }]
keywords = ["teal", "algorand", "codeql", "static-analysis", "avm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "PyYAML>=6",
    "networkx>=3",
]

[project.urls]
Repository = "https://github.com/Argimirodelpozo/codeql-TEAL"

[project.scripts]
tealql = "cli.main:main"

[tool.hatch.build.targets.wheel]
# Two packages: the ``tealtools`` analysis library (at
# ``analysis/tealtools/``) and the ``cli`` command-line front-end (at
# the top-level ``cli/`` directory). The CodeQL extractor + QL backend
# live outside the Python tree and are expected on the user's machine
# (codeql CLI on PATH, repo's .codeql-extractors/ for development).
packages = ["analysis/tealtools", "cli"]

[tool.hatch.build.targets.wheel.force-include]
# Bundle the .ql packs that tealtools.graphs depends on at runtime;
# without them the SSAProgram loader can't refresh its cached
# CodeQL annotations.
"analysis/tealtools/queries" = "tealtools/queries"
